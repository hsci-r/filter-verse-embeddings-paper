<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="825" viewBox="0 0 1550 825" role="img" aria-labelledby="title desc">
<title id="title">Verse embeddings for Finnic runosongs</title>
<desc id="desc">Original-language runosong verses are translated by DeepSeek-R1. A BERT student learns from masked language modelling and English verse and word alignment, producing verse embeddings for retrieval. A pale bear silhouette and a small paw print decorate the lower part of the diagram.</desc>
